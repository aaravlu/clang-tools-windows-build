name: clang-tools-windows-build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout LLVM
        uses: actions/checkout@v4
        with:
          repository: llvm/llvm-project
          ref: release/19.x
          path: llvm-project

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: 14.29

      - name: Configure CMake
        run: |
          cmake -S llvm-project/llvm -B build `
            -T v142 `
            -A x64 `
            -DBUILD_SHARED_LIBS=OFF `
            -DLLVM_ENABLE_ASSERTIONS=OFF `
            -DLLVM_ENABLE_PROJECTS="clang;clang-tools-extra" `
            -DCMAKE_BUILD_TYPE=MinSizeRel `
            -DLLVM_USE_CRT_MINSIZEREL="MT" `
            -DCMAKE_CXX_FLAGS="/std:c++14 /MP /Oi /O2 /Gy /GL /Gw /fp:fast /GS-" `
            -DCMAKE_EXE_LINKER_FLAGS="/LTCG /MANIFEST:NO /MERGE:_RDATA=.rdata /OPT:REF /OPT:ICF"

      - name: Build clang tools
        run: cmake --build build --config MinSizeRel --target clangd clang-format clang-tidy

      - name: Smoke test
        shell: cmd
        run: |
          cd build/MinSizeRel/bin
          clangd.exe --version
          clang-format.exe --version
          clang-tidy.exe --version

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clang-tools
          path: |
            build/MinSizeRel/bin/clangd.exe
            build/MinSizeRel/bin/clang-format.exe
            build/MinSizeRel/bin/clang-tidy.exe
